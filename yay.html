<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yay</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        background-color: black;
        color: white;
      }

      /* Default */
      button {
        padding: 5px 10px;
        margin: 5px;
        font-size: 14px;
        cursor: pointer;
        background-color: white;
        color: black;
        border: 2px solid white;
        transition:
          background-color 0.2s,
          color 0.2s; /* Smooth transition effect */
      }

      /* Hover */
      button:hover {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Yay!</h1>
    <a href="index.html"><button>Back</button></a>
  </body>
</html>
